# CodeQL 静态安全分析（GitHub 原生，自动检测 Python）
# 触发: push 到主分支 / PR / 每周二定时全量扫描
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "37 4 * * 2"  # 每周二 04:37 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fbcef3fba75224ed6476919775448de80b23cb15  # v3.32.0

      - name: Autobuild
        uses: github/codeql-action/autobuild@fbcef3fba75224ed6476919775448de80b23cb15  # v3.32.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fbcef3fba75224ed6476919775448de80b23cb15  # v3.32.0
        with:
          category: "/language:python"
