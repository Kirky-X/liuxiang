# Release 工作流：tag 触发 → 发布门禁 → 打包 .skill → 校验 → GitHub Release
# 参考: pangu release.yml
#
# 设计原则：
# - 发布门禁：tag 对应 commit 必须先通过 CI + CodeQL
# - 供应链安全：所有 actions SHA pin + 版本注释
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SKILL_NAME: ${{ github.event.repository.name }}
  EXCLUDE_PATTERNS: |
    .git/*
    .github/*
    .gitignore
    .gitattributes
    specmark/*
    logs/*
    */__pycache__/*
    *.pyc
    .claude/*
    .claude-plugin/*
    .trae/*
    .mimocode/*
    node_modules/*
    .venv/*

jobs:
  verify-gate:
    name: Verify CI & CodeQL passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify CI & CodeQL success on tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-list -n 1 "${GITHUB_REF}")
          echo "Tag commit: ${COMMIT_SHA}"
          FAILED=0
          for wf in ci.yml codeql.yml; do
            echo "=== Checking ${wf} ==="
            RUN_ID=$(gh run list \
              --workflow="${wf}" \
              --commit="${COMMIT_SHA}" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || echo "")
            if [ -z "${RUN_ID}" ]; then
              echo "ERROR: No successful ${wf} run found for commit ${COMMIT_SHA}"
              FAILED=1
            else
              echo "OK ${wf} run ${RUN_ID} succeeded on ${COMMIT_SHA}"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: verify-gate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify tag matches skill.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SKILL_VERSION=$(python3 -c "import json; print(json.load(open('skill.json'))['version'])")
          if [ "$VERSION" != "$SKILL_VERSION" ]; then
            echo "ERROR: tag ($VERSION) != skill.json version ($SKILL_VERSION)"
            exit 1
          fi
          echo "OK tag $TAG matches skill.json version $SKILL_VERSION"

      - name: Pack skill archive (.skill)
        shell: bash
        run: |
          set -euo pipefail
          OUT="${SKILL_NAME}.skill"
          EXCLUDE_ARGS=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            EXCLUDE_ARGS+=(-x "$pattern")
          done <<< "${EXCLUDE_PATTERNS}"
          zip -r "$OUT" . "${EXCLUDE_ARGS[@]}"
          echo "packed ${OUT}"
          ls -lh "$OUT"

      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          OUT="${SKILL_NAME}.skill"
          echo "=== Archive contents ==="
          unzip -l "$OUT"
          for f in SKILL.md README.md skill.json LICENSE; do
            if ! unzip -l "$OUT" | grep -q " $f$"; then
              echo "ERROR: $f not found in archive"
              exit 1
            fi
          done
          for d in scripts; do
            if ! unzip -l "$OUT" | grep -q "${d}/"; then
              echo "ERROR: ${d}/ directory not found in archive"
              exit 1
            fi
          done
          echo "OK Archive contains all required files"

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          set -euo pipefail
          OUT="${SKILL_NAME}.skill"
          sha256sum "$OUT" > "${OUT}.sha256"
          echo "=== SHA256 ==="
          cat "${OUT}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ## 完整性校验

            下载 `${{ env.SKILL_NAME }}.skill.sha256` 后用以下命令验证归档完整性：

            ```bash
            sha256sum -c ${{ env.SKILL_NAME }}.skill.sha256
            ```

            期望输出：`${{ env.SKILL_NAME }}.skill: OK`

            ## 发布门禁

            本 release 已通过以下审查：
            - **CI workflow**：ruff / yamllint / prettier / skill.json 校验 / 脚本引用完整性
            - **CodeQL 静态安全扫描**：Python SAST
          files: |
            ${{ env.SKILL_NAME }}.skill
            ${{ env.SKILL_NAME }}.skill.sha256
