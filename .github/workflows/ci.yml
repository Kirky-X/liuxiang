# Liuxiang 自身质量门禁：ruff / yamllint / prettier / skill.json 校验
# 参考: pangu ci.yml（适配 Python 脚本仓库特性）
#
# 设计原则：
# - 职责分离：lint job（格式+语法）与 integrity job（内容校验）并行
# - 渐进式阻断：ruff 严格阻断；Markdown 历史格式 warning-only
# - 供应链安全：所有 actions 使用 SHA pin + 版本注释
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + yamllint + prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Ruff：Python 脚本 lint（search_papers.py / download_paper.py / pdf2md.py / html2md.py）
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: |
          set -euo pipefail
          ruff check scripts/

      # Yamllint：检查所有 yaml/yml
      - name: Install yamllint
        run: pip install -r .github/requirements-ci.txt

      - name: Yamllint
        run: |
          set -euo pipefail
          mapfile -t yamls < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*')
          if [ "${#yamls[@]}" -eq 0 ]; then
            echo "No YAML files found"
            exit 0
          fi
          printf '%s\n' "${yamls[@]}"
          yamllint -c .github/yamllint-ci.yml "${yamls[@]}"

      # Prettier：检查 markdown/json 格式
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install prettier
        run: |
          cd .github && npm ci

      # JSON 严格检查（阻断）
      - name: Prettier check (JSON, blocking)
        run: |
          set -euo pipefail
          mapfile -t jsons < <(find . -maxdepth 1 -type f -name '*.json' -not -name 'package-lock.json')
          if [ "${#jsons[@]}" -eq 0 ]; then
            echo "No JSON files found"
            exit 0
          fi
          printf '%s\n' "${jsons[@]}"
          npx --prefix .github prettier --check "${jsons[@]}"

      # Markdown 检查（warning-only）
      - name: Prettier check (Markdown, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t mds < <(find . -maxdepth 1 -type f -name '*.md')
          for d in reference references agents examples templates; do
            [ -d "$d" ] && mapfile -t -O "${#mds[@]}" mds < <(find "$d" -type f -name '*.md' 2>/dev/null)
          done
          if [ "${#mds[@]}" -eq 0 ]; then
            echo "No Markdown files found"
            exit 0
          fi
          printf '%s\n' "${mds[@]}"
          npx --prefix .github prettier --prose-wrap preserve --check "${mds[@]}"

  integrity:
    name: skill.json 校验 + 脚本引用完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # skill.json 校验：JSON 语法 + 必填字段
      - name: Validate skill.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          with open('skill.json') as f:
              data = json.load(f)
          required = ['name', 'description', 'license', 'version', 'author', 'tag']
          missing = [k for k in required if k not in data or not data[k]]
          if missing:
              print(f"MISSING required fields: {missing}", file=sys.stderr)
              sys.exit(1)
          if not isinstance(data['tag'], list) or not data['tag']:
              print("ERROR: tag must be a non-empty list", file=sys.stderr)
              sys.exit(1)
          print(f"  OK skill.json (name={data['name']}, version={data['version']})")
          PY

      # SKILL.md 中引用的脚本必须存在
      - name: Verify SKILL.md script references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os, sys
          with open('SKILL.md') as f:
              content = f.read()
          refs = set(re.findall(r'scripts/([a-z_]+\.py)', content))
          missing = [r for r in refs if not os.path.isfile(f'scripts/{r}')]
          if missing:
              print(f"SKILL.md references non-existent scripts: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"  OK All {len(refs)} script references in SKILL.md exist")
          PY

      # reference/ 文档引用完整性
      - name: Verify reference doc references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os, sys
          with open('SKILL.md') as f:
              content = f.read()
          refs = set(re.findall(r'reference/([a-z]+\.md)', content))
          missing = [r for r in refs if not os.path.isfile(f'reference/{r}')]
          if missing:
              print(f"SKILL.md references non-existent docs: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"  OK All {len(refs)} reference doc references exist")
          PY
